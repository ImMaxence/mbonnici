# ──────────────────────────────────────────────────────────────────────────────
# mbonnici.fr — production stack (Coolify "Docker Compose" resource)
#
#   Cloudflare ─► Coolify/Traefik (TLS) ─► frontend:4000 (SSR + /api proxy) ─► backend:8080
#                                                                            ├► db (PostgreSQL)
#                                                                            └► seaweed (S3)
# Only `frontend` is reachable from outside: set the domain on that service, port 4000.
# Variables come from .env (see .env.example).
# ──────────────────────────────────────────────────────────────────────────────
services:
  frontend:
    build:
      # root context: the Dockerfile also ships CHANGELOG.md for the back-office releases page
      context: .
      dockerfile: frontend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: mbonnici/frontend:${GIT_SHA:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      PROXY_API: "true"
      API_BASE_URL: http://backend:8080
      APP_URL: ${APP_URL:-https://mbonnici.fr}
      # Traefik / Cloudflare sit in front: trust X-Forwarded-* for absolute URLs and host checks
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # extra hostnames allowed to reach the SSR server (comma-separated), APP_URL's host is implicit
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: mbonnici/backend:${GIT_SHA:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-portfolio}
      DB_USER: ${POSTGRES_USER:-portfolio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PORT: "8080"
      S3_ENDPOINT: http://seaweed:8333
      S3_BUCKET: ${S3_BUCKET:-portfolio-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-portfolio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-maxence.bonnici2002@gmail.com}
      APP_URL: ${APP_URL:-https://mbonnici.fr}
      ANALYTICS_SALT_SECRET: ${ANALYTICS_SALT_SECRET:?set ANALYTICS_SALT_SECRET in .env}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      FORWARD_HEADERS_STRATEGY: framework
      COOKIE_SECURE: "true"
      GIT_SHA: ${GIT_SHA:-}
    depends_on:
      db:
        condition: service_healthy
      seaweed:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep -q '\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/<major>/docker
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for images. SeaweedFS is free (Apache-2.0) and tiny; swap for
  # any S3 endpoint (MinIO, Garage, Cloudflare R2…) by changing the S3_* variables on `backend`.
  seaweed:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip=seaweed -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweed-data:/data
    expose:
      - "8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

configs:
  s3-identities:
    content: |
      {
        "identities": [
          {
            "name": "portfolio",
            "credentials": [{ "accessKey": "${S3_ACCESS_KEY:-portfolio}", "secretKey": "${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}" }],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }

volumes:
  db-data:
  seaweed-data:
