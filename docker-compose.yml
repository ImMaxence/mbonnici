# ──────────────────────────────────────────────────────────────────────────────
# mbonnici.fr — production stack, deployed by Coolify (Docker Compose build pack)
#
#   Cloudflare ─► Coolify/Traefik (TLS) ─► frontend:4000 (SSR + /api proxy) ─► backend:8080
#                                                                            ├► db (PostgreSQL)
#                                                                            └► seaweed (S3)
# Only `frontend` has a domain in Coolify (https://mbonnici.fr, port 4000); nothing is published.
# Secrets come from Coolify:
#   - SERVICE_USER_* / SERVICE_PASSWORD_64_*: generated by Coolify on the first deployment, kept after
#     (never regenerate POSTGRES ones: the database keeps the user and password it was created with);
#   - GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ADMIN_EMAIL (one or more addresses separated by ";"):
#     entered in Environment Variables, like RECAPTCHA_SITE_KEY and RECAPTCHA_SECRET_KEY.
# Local runs use docker-compose.local.yml instead.
# ──────────────────────────────────────────────────────────────────────────────

# Logs kept per container: 3 files of 10 MB, the oldest dropped first.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  frontend:
    build:
      # root context: the Dockerfile also ships CHANGELOG.md for the back-office releases page
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: "4000"
      PROXY_API: "true"
      API_BASE_URL: http://backend:8080
      APP_URL: https://mbonnici.fr
      # Traefik / Cloudflare sit in front: trust X-Forwarded-* for absolute URLs and host checks
      TRUST_PROXY: "true"
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      DB_URL: jdbc:postgresql://db:5432/portfolio
      DB_USER: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      PORT: "8080"
      S3_ENDPOINT: http://seaweed:8333
      S3_BUCKET: portfolio-media
      S3_ACCESS_KEY: ${SERVICE_USER_S3}
      S3_SECRET_KEY: ${SERVICE_PASSWORD_64_S3}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      # the Google account(s) allowed in the back office, separated by ";"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      APP_URL: https://mbonnici.fr
      # Google reCAPTCHA on the contact form: a checkbox key (see .env.example)
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:?}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:?}
      # derives the daily salt of the anonymous visitor hashes
      ANALYTICS_SALT_SECRET: ${SERVICE_PASSWORD_64_ANALYTICS}
      # real visitor IP from CF-Connecting-IP: the server must accept Cloudflare's addresses only
      TRUST_PROXY: "true"
      FORWARD_HEADERS_STRATEGY: framework
      COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
      seaweed:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep -q '\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/<major>/docker
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for images and the resume. SeaweedFS is free (Apache-2.0) and tiny.
  seaweed:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    logging: *logging
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip=seaweed -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweed-data:/data
    expose:
      - "8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

configs:
  s3-identities:
    content: |
      {
        "identities": [
          {
            "name": "portfolio",
            "credentials": [{ "accessKey": "${SERVICE_USER_S3}", "secretKey": "${SERVICE_PASSWORD_64_S3}" }],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }

volumes:
  db-data:
  seaweed-data:
