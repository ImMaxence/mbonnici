name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend · build + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend (SSR)
        working-directory: frontend
        run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Start PostgreSQL + MinIO
        run: docker compose -f docker-compose.dev.yml up -d --wait

      - name: Build and start backend
        working-directory: backend
        run: |
          ./mvnw -B -q --no-transfer-progress package -DskipTests
          nohup java -jar target/*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8081/api/actuator/health | grep -q UP; then echo "backend up"; exit 0; fi
            sleep 2
          done
          echo "backend did not start"; cat backend.log; exit 1
        env:
          APP_URL: http://localhost:4000
          ANALYTICS_SALT_SECRET: ci-salt

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
