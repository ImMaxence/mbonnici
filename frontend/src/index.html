<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Maxence Bonnici</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#efede7">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- the intro sheet is painted at once: its two fonts must be there, not swapped in afterwards -->
  <link rel="preload" href="/fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script nonce="__CSP_NONCE__">
    (function () {
      var d = document.documentElement;
      try {
        var mode = localStorage.getItem('mb.mode');
        var dark = mode === 'dark' || ((!mode || mode === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        d.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
      try {
        // the intro plays once per visit, never for reduced motion, never in the back office
        if (!sessionStorage.getItem('mb.intro') && !matchMedia('(prefers-reduced-motion: reduce)').matches && location.pathname.indexOf('/admin') !== 0) {
          d.classList.add('intro-play');
          sessionStorage.setItem('mb.intro', '1');
        }
      } catch (e) {}
      // the "js" class (which arms the scroll reveals) is added by the app once hydrated,
      // so server-rendered content is visible immediately on slow devices
    })();
  </script>
  <style nonce="__CSP_NONCE__">
    /* what the very first frame needs (the stylesheet loads async); scripts/shell.mjs fills the dark palette */
    /* theme:dark */html[data-theme=dark] {color-scheme:dark;--bg:#0d0d0c;--bg-2:#151514;--bg-3:#1d1d1b;--bg-4:#2a2a27;--fg:#eceae3;--fg-2:#aaa89f;--fg-3:#8b897f;--line:rgba(236, 234, 227, 0.11);--line-strong:rgba(236, 234, 227, 0.24);--accent:#8c96ff;--accent-fg:#0d0d0c;--accent-soft:rgba(140, 150, 255, 0.14);--mark:#ff8a3d;--success:#6fd38a;--warning:#f0b54a;--danger:#ff7a70;--glass:rgba(13, 13, 12, 0.72);--glass-strong:rgba(13, 13, 12, 0.92);--glass-border:rgba(236, 234, 227, 0.12);--glass-highlight:rgba(236, 234, 227, 0.06);--shadow-1:0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);--shadow-2:0 20px 50px -12px rgba(0, 0, 0, 0.6);--shadow-3:0 40px 90px -20px rgba(0, 0, 0, 0.75);--device:#050505;--chart-1:#3f7fe0;--chart-2:#c97a1f}/* /theme:dark */
    /* the intro's fonts, preloaded above; "block": invisible for the few ms they take, never the system font first */
    @font-face{font-family:'Inter Tight Variable';font-style:normal;font-display:block;font-weight:100 900;src:url(/fonts/inter-tight-latin-wght-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:'JetBrains Mono Variable';font-style:normal;font-display:block;font-weight:100 800;src:url(/fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    /* intro sheet */
    .intro{display:none}
    html.intro-play .intro{position:fixed;inset:0;z-index:300;container-type:inline-size;display:grid;align-content:end;gap:1.5rem;padding:clamp(1rem,3.6vw,3rem);padding-bottom:calc(clamp(1rem,3.6vw,3rem) + env(safe-area-inset-bottom));background:#121211;color:#efede7;pointer-events:none;will-change:transform;animation:intro-lift 1s cubic-bezier(.76,0,.24,1) 1.45s both}
    html[data-theme=dark].intro-play .intro{background:#eceae3;color:#0d0d0c}
    .intro-meta{display:flex;justify-content:space-between;gap:1rem;font:500 .72rem/1 'JetBrains Mono Variable',ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;opacity:0;animation:intro-fade .6s cubic-bezier(.16,1,.3,1) .25s both}
    .intro-bar{height:1px;background:currentColor;opacity:.35;transform-origin:0 50%;animation:intro-bar 1.3s cubic-bezier(.65,0,.35,1) .1s both}
    .intro-name{display:grid;font-family:'Inter Tight Variable','Inter Variable',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;font-size:17.18cqi;line-height:.8;letter-spacing:-.04em;white-space:nowrap;margin-left:-.05em}
    .intro-name>span{display:block;overflow:hidden;padding:0 .1em .08em;margin:0 -.1em}
    .intro-name>span>span{display:inline-block;transform:translate3d(0,105%,0);animation:intro-line 1s cubic-bezier(.16,1,.3,1) calc(.1s + var(--i,0)*.09s) both}
    @keyframes intro-line{to{transform:none}}
    @keyframes intro-fade{to{opacity:1}}
    @keyframes intro-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes intro-lift{to{transform:translate3d(0,-100%,0);visibility:hidden}}
    @media (prefers-reduced-motion:reduce){html.intro-play .intro{display:none}}
  </style>
</head>
<body>
  <div class="intro" aria-hidden="true">
    <div class="intro-meta"><span>Portfolio</span><span>Aix-en-Provence</span></div>
    <div class="intro-bar"></div>
    <!-- MBONNICI.FR in Inter Tight 600 at -0.04em: 5.818em of ink from 0.05em, so 17.18cqi fills the width -->
    <div class="intro-name"><span><span style="--i: 0">MBONNICI.FR</span></span></div>
  </div>
  <app-root ngCspNonce="__CSP_NONCE__"></app-root>
</body>
</html>
